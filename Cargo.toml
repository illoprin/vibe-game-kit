[package]
name = "webgpu-cube"
version = "0.1.0"
edition = "2021"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = "0.29"
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wgpu = "24"
winit = "0.30"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }
