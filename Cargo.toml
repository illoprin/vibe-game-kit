[package]
name = "vibe-game-kit"
version = "0.0.1"
edition = "2021"
build = "src/build.rs"

[dependencies]
bytemuck = { version = "1.21", features = ["derive"] }
egui = "0.31"
egui-wgpu = "0.31"
egui-winit = "0.31"
glam = "0.29"
image = { version = "0.25", default-features = false, features = ["png"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
wgpu = "24"
winit = "0.30"

[dev-dependencies]
naga = { version = "24", features = ["wgsl-in"] }

[build-dependencies]
winres = "0.1"
